<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>工程案例 — 邵阳市星海科技有限公司</title>
<meta name="robots" content="noindex, nofollow"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231a56db'/%3E%3Ctext x='50' y='70' font-size='58' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E%E6%98%9F%3C/text%3E%3C/svg%3E"/>
<style>
:root{--blue:#1a56db;--ink:#1f2937;--muted:#6b7280;--bg:#f6f8fc;--card:#fff;--line:#e2e8f0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;padding-bottom:72px}
.container{max-width:760px;margin:0 auto;padding:18px}
h1{font-size:1.3em;margin:20px 0 4px}
.tag{display:inline-block;font-size:.8em;color:var(--blue);background:#eef4ff;border:1px solid #d8e3fb;border-radius:14px;padding:3px 14px;margin:6px 0 16px}
.desc-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;font-size:.95em;white-space:pre-line;margin-bottom:18px}
.desc-card h2{font-size:1em;border-left:4px solid var(--blue);padding-left:10px;margin-bottom:12px}
.main-img{width:100%;border-radius:14px;background:#fff;border:1px solid var(--line);display:block;object-fit:contain;max-height:60vh;margin-bottom:12px}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:2px solid transparent;cursor:pointer;background:#fff}
.thumbs img.on{border-color:var(--blue)}
.img-count{font-size:.8em;color:var(--muted);margin-bottom:16px}
/* 底部固定通栏：返回官网 + 一键拨打 */
.fixed-bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:20;box-shadow:0 -2px 10px rgba(0,0,0,.05)}
.fixed-bar a{flex:1;text-align:center;padding:15px 8px;text-decoration:none;font-weight:600;font-size:.95em;display:block}
.fixed-bar .back{background:#fff;color:var(--ink)}
.fixed-bar .call{background:var(--blue);color:#fff}
.err{text-align:center;padding:60px 20px;color:var(--muted)}
.err a{color:var(--blue)}
footer{text-align:center;color:var(--muted);font-size:.8em;padding:8px 0 24px}
</style>
</head>
<body>

<div class="container" id="app">
  <div class="err" id="loading">正在加载案例内容…</div>
</div>

<footer id="foot" style="display:none">邵阳市星海科技有限公司 · 弱电智能化工程</footer>

<div class="fixed-bar" id="bar" style="display:none">
  <a class="back" href="index.html#cases">&#8592; 返回官网</a>
  <a class="call" id="callLink" href="tel:">&#128222; 咨询类似方案</a>
</div>

<script>
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];})}

var id = -1;
try {
  var m = location.search.match(/[?&]id=(\d+)/);
  if (m) id = +m[1];
} catch(e){}

fetch("content.json", {cache:"no-store"}).then(function(r){
  if (!r.ok) throw 0;
  return r.json();
}).then(function(c){
  var app = document.getElementById("app");
  var cs = (c.cases || [])[id];
  if (!cs){ throw "notfound"; }

  var imgs = Array.isArray(cs.imgs) ? cs.imgs : [];
  var company = (c.company && c.company.name) || "邵阳市星海科技有限公司";
  var phone = (c.contact && c.contact.phone) || "";
  var pm = String(phone).match(/1[3-9]\d{9}/);
  var tel = pm ? pm[0] : String(phone).replace(/[^0-9+]/g, "");

  // 排版：标题 → 标签 → 项目介绍 → 图片（大图+缩略图）
  var gallery = imgs.length
    ? '<img class="main-img" id="mainImg" src="' + esc(imgs[0]) + '" alt="' + esc(cs.title) + '"/>' +
      (imgs.length > 1
        ? '<div class="thumbs" id="thumbs">' + imgs.map(function(p, i){
            return '<img src="' + esc(p) + '" data-i="' + i + '"' + (i === 0 ? ' class="on"' : '') + '/>';
          }).join('') + '</div>' +
          '<div class="img-count">共 ' + imgs.length + ' 张实景图 · 点缩略图切换</div>'
        : '')
    : '<div class="img-count">项目图片整理中</div>';

  app.innerHTML =
    '<h1>' + esc(cs.title) + '</h1>' +
    (cs.tag ? '<span class="tag">' + esc(cs.tag) + '</span>' : '') +
    '<div class="desc-card"><h2>项目介绍</h2>' + esc(cs.desc || "详情整理中") + '</div>' +
    gallery;
  document.title = cs.title + " — " + company;
  document.getElementById("foot").style.display = "block";

  // 底部固定通栏：返回官网 + 一键拨打
  var bar = document.getElementById("bar");
  bar.style.display = "flex";
  if (tel) document.getElementById("callLink").href = "tel:" + tel;
  else document.getElementById("callLink").style.display = "none";

  var mainImg = document.getElementById("mainImg");
  if (mainImg){
    var thumbs = document.getElementById("thumbs");
    if (thumbs) thumbs.addEventListener("click", function(e){
      if (e.target.tagName !== "IMG") return;
      mainImg.src = e.target.src;
      Array.prototype.forEach.call(thumbs.children, function(t){ t.classList.toggle("on", t === e.target); });
    });
  }
}).catch(function(e){
  document.getElementById("app").innerHTML =
    '<div class="err">&#128269; ' + (e === "notfound" ? "没有找到这个案例，可能已被调整。" : "加载失败，请检查网络后重试。") +
    '<br/><br/><a href="index.html#cases">&#8592; 返回工程案例列表</a></div>';
});
</script>
</body>
</html>
